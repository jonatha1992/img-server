name: img-server
services:
  img-server:
    build:
      context: ..
    container_name: img-server
    restart: unless-stopped
    env_file: .env.prod
    environment:
      TZ: UTC
      PUBLIC_URL: https://img.tecnofusion.dev
    volumes:
      - img_data:/data
    labels:
      - traefik.enable=true
      - traefik.docker.network=edge
      - traefik.http.routers.img-server.entrypoints=web
      - traefik.http.routers.img-server.rule=Host(`img.tecnofusion.dev`)
      - traefik.http.services.img-server.loadbalancer.server.port=3000
    ports:
      - 127.0.0.1:3940:3000
    networks:
      - edge
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 200
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
volumes:
  img_data:
networks:
  edge:
    external: true
